<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internships — Edu-Link AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../shared/css/global.css">
  <link rel="stylesheet" href="../shared/css/layout.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="internships.css">
</head>
<body>

  <div class="app-layout" id="app-layout">
    <div class="main-content">
      <div class="page-content">

        <div class="page-header">
          <h1>Internships</h1>
          <p>AI-matched opportunities with explainable scores</p>
        </div>

        <div id="alertBox" class="alert hidden"></div>

        <!-- Tabs -->
        <div class="tabs">
          <button class="tab-btn active" data-tab="matches">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>AI Matches</span>
          </button>
          <button class="tab-btn" data-tab="applications">
            <i class="fa-solid fa-paper-plane"></i>
            <span>My Applications</span>
          </button>
        </div>

        <!-- TAB 1: MATCHES -->
        <div class="tab-panel active" id="tab-matches">
          <div class="results-header">
            <span id="resultsCount">0 internships found</span>
          </div>

          <div class="internships-list" id="internshipsList"></div>

          <div class="card empty-state hidden" id="internshipsEmpty">
            <i class="fa-solid fa-briefcase"></i>
            <h3>No internships yet</h3>
            <p>Companies haven't posted any internships. Check back soon!</p>
          </div>
        </div>

        <!-- TAB 2: APPLICATIONS -->
        <div class="tab-panel" id="tab-applications">
          <div class="card empty-state" id="applicationsEmpty">
            <i class="fa-solid fa-inbox"></i>
            <h3>No applications yet</h3>
            <p>Start applying to internships that match your skills.</p>
          </div>

          <div class="applications-list" id="applicationsList"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Explanation Modal -->
  <div class="modal-overlay hidden" id="explanationModal">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h3>Match Explanation</h3>
          <p class="text-muted" style="font-size: 0.85rem; margin: 4px 0 0;">
            Why this internship matches you
          </p>
        </div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>

      <div class="modal-body" id="modalBody"></div>

      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Close</button>
        <button class="btn btn-primary" id="modalApplyBtn">
          <i class="fa-solid fa-paper-plane"></i>
          Apply Now
        </button>
      </div>
    </div>
  </div>

  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="../shared/js/auth.js"></script>
  <script src="../shared/js/guard.js"></script>
  <script src="../shared/js/layout.js"></script>
  <script src="internships.js"></script>
</body>
</html>
